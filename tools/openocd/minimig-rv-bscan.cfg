# OpenOCD 0.12: Minimig OSD RISC-V host CPU, debug tunnelled through the
# FPGA's own JTAG chain (Xilinx 7-series BSCANE2, USER4).
# Bitstream: host_bridge generic rv_debug = 1
# (VexOsd_DMT + rtl/host/xilinx/rv_bscane2.v).  The JTAG path is the board's
# normal FPGA JTAG header, the one Vivado programs through.
#
# Default adapter: remote_bitbang (remote-bitbang.cfg) to the Phase 5.4
# hw_server bridge on 127.0.0.1:33582, which drives the header through the
# Platform Cable USB II (the decided path, README.md); the Verilator bench
# sim/rv_dbg serves the same protocol on its own port:
#
#   openocd -f tools/openocd/minimig-rv-bscan.cfg
#   openocd -c "set RBB_PORT 44853" -f tools/openocd/minimig-rv-bscan.cfg
#   openocd -c "set ADAPTER interface/ftdi/digilent_jtag_hs3.cfg" -f tools/openocd/minimig-rv-bscan.cfg
#
# Set ADAPTER / RBB_HOST / RBB_PORT / SPEED_KHZ with -c "set ..." before -f.

# ---- adapter -------------------------------------------------------------
if { ![info exists ADAPTER] } { set ADAPTER [file dirname [info script]]/remote-bitbang.cfg }
source [find $ADAPTER]
transport select jtag
# SPEED_KHZ applies to adapters with a clock of their own (FTDI etc.);
# remote_bitbang has none and ignores it (the server sets the TCK rate)
if { ![info exists SPEED_KHZ] } { set SPEED_KHZ 5000 }
adapter speed $SPEED_KHZ

# ---- target ----------------------------------------------------------------
# XC7A100T TAP (IR 6 bits, IDCODE x3631093), as in the VexRiscv README
source [find cpld/xilinx-xc7.cfg]
set TAP_NAME xc7.tap
set _TARGETNAME cpu
target create $_TARGETNAME.0 riscv -chain-position $TAP_NAME
# DTM behind USER4 (IR 0x23), data-register tunnel; must match
# rv_bscane2.v JTAG_CHAIN = 4
riscv use_bscan_tunnel 6 1

gdb_report_data_abort enable
