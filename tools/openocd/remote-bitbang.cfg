# OpenOCD 0.12 adapter: remote_bitbang over TCP.
#
# The server is either the Phase 5.4 hw_server bridge (rv_jtag_bridge.tcl,
# default port 33582, next to 832bridge.tcl's 33581) that drives the board's
# FPGA JTAG header through the Platform Cable USB II, or the Verilator
# debug bench sim/rv_dbg (harness port RBB_PORT, default 44853 there).
#
# Tcl variables (set them with -c "set ..." before -f):
#   RBB_HOST  default 127.0.0.1
#   RBB_PORT  default 33582 (the bridge)
#
#   openocd -f tools/openocd/remote-bitbang.cfg ...
#   openocd -c "set RBB_PORT 44853" -c "set ADAPTER tools/openocd/remote-bitbang.cfg" \
#           -f tools/openocd/minimig-rv-bscan.cfg
#
# remote_bitbang has no clock of its own: "adapter speed" does not apply
# (the server sets the TCK rate).

if { ![info exists RBB_HOST] } { set RBB_HOST 127.0.0.1 }
if { ![info exists RBB_PORT] } { set RBB_PORT 33582 }
adapter driver remote_bitbang
remote_bitbang host $RBB_HOST
remote_bitbang port $RBB_PORT
