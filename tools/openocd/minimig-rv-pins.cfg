# OpenOCD 0.12: Minimig OSD RISC-V host CPU, debug TAP on four FPGA pins.
# Bitstream: EightThirtyTwo_Bridge generics cpu_riscv = true, rv_debug = 2
# (VexOsd_DMJ: RISC-V Debug Module + its own JTAG TAP, IDCODE 0x10002FFF,
# IR 5 bits) with rv_jtag_tck/tms/tdi/tdo on header pins.
#
#   openocd -f tools/openocd/minimig-rv-pins.cfg
#   openocd -c "set ADAPTER interface/jlink.cfg" -f tools/openocd/minimig-rv-pins.cfg
#
# Simulation (sim/rv_dbg, harness with DEBUG = 2): remote_bitbang to the
# bench's port:
#   openocd -c "set ADAPTER tools/openocd/remote-bitbang.cfg" -c "set RBB_PORT 44853" \
#           -f tools/openocd/minimig-rv-pins.cfg
#
# The TAP is alone on its chain (the adapter's TCK/TMS/TDI/TDO go to the
# four FPGA pins, not to the FPGA's JTAG header).  See README.md.

# ---- adapter: any OpenOCD JTAG adapter; set ADAPTER to its config ----------
# Example: Digilent JTAG-HS2 (FTDI FT232H, adapter driver ftdi).
if { ![info exists ADAPTER] } { set ADAPTER interface/ftdi/digilent-hs2.cfg }
source [find $ADAPTER]
transport select jtag
# the wires to the header pins: start slow, raise when it works
# (remote_bitbang ignores it: the server sets the TCK rate)
if { ![info exists SPEED_KHZ] } { set SPEED_KHZ 1000 }
adapter speed $SPEED_KHZ

# ---- target ----------------------------------------------------------------
set _CHIPNAME riscv
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x10002FFF
set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME.0 riscv -chain-position $_TARGETNAME

# boot ROM 0x0-0x1FFF, firmware from 0x2000 in SDRAM: software breakpoints
# work everywhere (the boot ROM BRAM is writable), memory via abstract
# commands / program buffer
gdb_report_data_abort enable
